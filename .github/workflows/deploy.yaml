name: Multiplatform test release
on:
  push:
    tags: ['rk-2.1.0-multiplatform-test.*']
permissions:
  contents: read
jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x64
          - os: ubuntu-22.04
            platform: linux-x64
          - os: macos-15-intel
            platform: macos-x64
          - os: macos-15
            platform: macos-arm64
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '3'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang libclang-dev cmake pkg-config libssl-dev libglib2.0-dev libatk1.0-dev libgtk-3-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libwayland-dev
      - name: Windows clang
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV'
      - name: macOS clang
        if: runner.os == 'macOS'
        run: echo "LIBCLANG_PATH=$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.platform }}
      - name: Build locked release
        run: cargo build --locked --release --bin kaspa-ng
      - name: Smoke test executable
        shell: bash
        run: |
          target/release/kaspa-ng --help | tee help-output.txt
          grep -F 'rusty-kaspa 2.1.0' help-output.txt
      - name: Package executable and instructions
        run: python scripts/package-test-release.py --platform ${{ matrix.platform }} --tag ${{ github.ref_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.platform }}
          path: release-dist/*
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: release-dist
          merge-multiple: true
      - name: Verify archives and publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd release-dist
          cat *.sha256 > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          gh release create "$RELEASE_TAG" --verify-tag --prerelease --title "Kaspa NG / RK 2.1.0 - Multiplatform Test" --notes-file ../docs/TEST-RELEASE.md *.zip *.tar.gz SHA256SUMS.txt
